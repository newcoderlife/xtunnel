name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          pull: true
          platforms: linux/amd64
          tags: xtunnel:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test server mode
        run: |
          set -eux
          cid=$(docker run -d -e DOMAIN=localhost -e VTEP_IP=127.0.0.1 -e CLOUDFLARE_API_TOKEN=0000000000000000000000000000000000000000 xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true
          docker exec "$cid" grep -F 'handle @xhttp' /data/Caddyfile
          docker exec "$cid" grep -F 'reverse_proxy 127.0.0.1:8080' /data/Caddyfile

      - name: Smoke test client mode
        run: |
          set -eux
          cid=$(docker run -d \
            -e PEERS=s1 \
            -e S1_DOMAIN=localhost \
            -e S1_FORWARD_UUID=00000000-0000-4000-8000-000000000001 \
            -e S1_REVERSE_UUID=00000000-0000-4000-8000-000000000002 \
            -e S1_LOCAL_VTEP_IP=127.0.0.2 \
            xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: mode=min
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build smoke image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          pull: true
          platforms: linux/amd64
          tags: xtunnel:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test server mode
        run: |
          set -eux
          cid=$(docker run -d -e DOMAIN=localhost -e VTEP_IP=127.0.0.1 -e CLOUDFLARE_API_TOKEN=0000000000000000000000000000000000000000 xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true

      - name: Smoke test client mode
        run: |
          set -eux
          cid=$(docker run -d \
            -e PEERS=s1 \
            -e S1_DOMAIN=localhost \
            -e S1_FORWARD_UUID=00000000-0000-4000-8000-000000000001 \
            -e S1_REVERSE_UUID=00000000-0000-4000-8000-000000000002 \
            -e S1_LOCAL_VTEP_IP=127.0.0.2 \
            xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: mode=min
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

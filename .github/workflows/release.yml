name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          pull: true
          platforms: linux/amd64
          tags: xtunnel:ci
          provenance: false
          cache-from: type=gha

      - name: Smoke test server mode
        run: |
          set -eux
          cid=$(docker run -d -e DOMAIN=localhost -e VTEP_IP=127.0.0.1 xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true

      - name: Smoke test client mode
        run: |
          set -eux
          cid=$(docker run -d \
            -e PEERS=s1 \
            -e S1_DOMAIN=localhost \
            -e S1_FORWARD_UUID=00000000-0000-4000-8000-000000000001 \
            -e S1_REVERSE_UUID=00000000-0000-4000-8000-000000000002 \
            -e S1_LOCAL_VTEP_IP=127.0.0.2 \
            xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

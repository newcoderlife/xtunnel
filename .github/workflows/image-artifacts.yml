name: Image Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build ${{ matrix.platform }} artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: xtunnel-linux-amd64
          - platform: linux/arm64
            artifact: xtunnel-linux-arm64
          - platform: linux/arm/v7
            artifact: xtunnel-linux-arm-v7

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          pull: true
          tags: xtunnel:artifact
          provenance: false
          cache-from: type=gha,scope=image-artifacts-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=image-artifacts-${{ matrix.artifact }}

      - name: Pack image
        shell: bash
        run: |
          set -euxo pipefail
          docker save xtunnel:artifact | gzip > "${{ matrix.artifact }}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ matrix.artifact }}.tar.gz
          archive: false
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Summarize artifact
        run: |
          {
            echo "Published artifact: ${{ matrix.artifact }}.tar.gz"
            echo ""
            echo "Load it with:"
            echo '```sh'
            echo "gunzip -c ${{ matrix.artifact }}.tar.gz | docker load"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

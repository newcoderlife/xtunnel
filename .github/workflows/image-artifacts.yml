name: Image Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build ${{ matrix.platform }} artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: xtunnel-linux-amd64
          - platform: linux/arm64
            artifact: xtunnel-linux-arm64
          - platform: linux/arm/v7
            artifact: xtunnel-linux-arm-v7

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          pull: true
          tags: xtunnel:artifact
          provenance: false
          cache-from: type=gha,scope=image-artifacts-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=image-artifacts-${{ matrix.artifact }}

      - name: Pack image
        shell: bash
        run: |
          set -euxo pipefail
          docker save xtunnel:artifact | gzip > "${{ matrix.artifact }}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ matrix.artifact }}.tar.gz
          archive: false
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Summarize artifact
        run: |
          {
            echo "Published artifact: ${{ matrix.artifact }}.tar.gz"
            echo ""
            echo "Load it with:"
            echo '```sh'
            echo "gunzip -c ${{ matrix.artifact }}.tar.gz | docker load"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

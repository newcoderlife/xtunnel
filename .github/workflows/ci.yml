name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check entrypoint syntax
        run: docker run --rm -v "$PWD:/work" -w /work alpine:3.21 ash -n entrypoint.sh

      - name: Check entrypoint script
        run: shellcheck -s sh entrypoint.sh

  docker:
    runs-on: ubuntu-latest
    needs: shell
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          pull: true
          platforms: linux/amd64
          tags: xtunnel:ci
          provenance: false
          cache-from: type=gha

      - name: Smoke test server mode
        run: |
          set -eux
          cid=$(docker run -d -e DOMAIN=localhost -e VTEP_IP=127.0.0.1 xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true

      - name: Smoke test client mode
        run: |
          set -eux
          cid=$(docker run -d \
            -e PEERS=s1 \
            -e S1_DOMAIN=localhost \
            -e S1_FORWARD_UUID=00000000-0000-4000-8000-000000000001 \
            -e S1_REVERSE_UUID=00000000-0000-4000-8000-000000000002 \
            -e S1_LOCAL_VTEP_IP=127.0.0.2 \
            xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          pull: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

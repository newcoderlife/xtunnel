name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check entrypoint syntax
        run: docker run --rm -v "$PWD:/work" -w /work alpine:3.23@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11 ash -n entrypoint.sh

      - name: Check entrypoint script
        run: shellcheck -s sh entrypoint.sh

  docker:
    runs-on: ubuntu-latest
    needs: shell
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build smoke image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          pull: true
          platforms: linux/amd64
          tags: xtunnel:ci
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test server mode
        run: |
          set -eux
          cid=$(docker run -d -e DOMAIN=localhost -e VTEP_IP=127.0.0.1 -e CLOUDFLARE_API_TOKEN=0000000000000000000000000000000000000000 xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true

      - name: Smoke test client mode
        run: |
          set -eux
          cid=$(docker run -d \
            -e PEERS=s1 \
            -e S1_DOMAIN=localhost \
            -e S1_FORWARD_UUID=00000000-0000-4000-8000-000000000001 \
            -e S1_REVERSE_UUID=00000000-0000-4000-8000-000000000002 \
            -e S1_LOCAL_VTEP_IP=127.0.0.2 \
            xtunnel:ci)
          cleanup() { status=$?; docker logs "$cid" || true; docker rm -f "$cid" || true; exit "$status"; }
          trap cleanup EXIT
          sleep 5
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true

      - name: Scan smoke image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: xtunnel:ci
          scan-type: image
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln

      - name: Upload Trivy scan results
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          pull: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
